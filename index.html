<!DOCTYPE html>

<head>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f5;--card:#fff;--ink:#12303a;--mute:#5a7279;--line:#d5e2e0;--accent:#0f7c86;--accent-ink:#fff;--gold:#b9801a;--ok:#1f8a4c;--off:#a24b3b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1e;--card:#15262b;--ink:#e8f1f0;--mute:#93aeb2;--line:#25404620;--line:#264046;--accent:#3fc1cc;--accent-ink:#06262a;--gold:#e0a84a;--ok:#4cc884;--off:#e48c7b}}
:root[data-theme="dark"]{--bg:#0e1a1e;--card:#15262b;--ink:#e8f1f0;--mute:#93aeb2;--line:#264046;--accent:#3fc1cc;--accent-ink:#06262a;--gold:#e0a84a;--ok:#4cc884;--off:#e48c7b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;min-height:100vh;display:flex;justify-content:center;padding:20px 16px 40px}
main{width:100%;max-width:460px}
.top{display:flex;justify-content:flex-end;gap:6px;margin-bottom:18px}
.top button{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--mute);padding:6px 12px;border-radius:999px;cursor:pointer}
.top button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1{font-size:clamp(40px,12vw,56px);line-height:1.02;font-weight:800;letter-spacing:-.03em;margin:0 0 10px}
h1 span{display:block;color:var(--accent)}
.sub{color:var(--mute);margin:0 0 22px;font-size:17px}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);margin-bottom:18px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--off)}
.status.open .dot{background:var(--ok)}
.actions{display:grid;gap:10px;margin-bottom:22px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 18px;font-weight:600;min-height:56px}
.btn small{display:block;font-weight:400;color:var(--mute);font-size:14px;word-break:break-all}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.main small{color:inherit;opacity:.85}
.btn svg{flex:none;width:22px;height:22px}
.info{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:10px}
.info h2{font-size:16px;margin:0 0 8px;font-weight:800}
.info p{margin:0;color:var(--mute)}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
.row b{font-weight:600}
.maps{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.maps a{color:var(--accent);font-weight:700;text-decoration:none;border-bottom:2px solid var(--accent)}
.svc{list-style:none;margin:0;padding:0}
.svc li{padding:8px 0 8px 28px;position:relative;border-bottom:1px dashed var(--line);font-weight:600}
.svc li:last-child{border:0}
.svc li::before{content:"";position:absolute;left:4px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
footer{text-align:center;color:var(--mute);font-size:13px;margin-top:18px}
</style>
</head>
<body>

<div class="top" role="group" aria-label="Language">

</main>

<script>
var T={
ru:{and:"и Кирил",city:"Компьютерная помощь и игры в Бухаре",chan:"Канал игр для PS4 и PS5",call:"Позвонить",map:"Открыть на карте",addr:"Бухара, ул. Мустакиллик, дом 26",hrs:"Часы работы",svc:"Чем мы занимаемся",s1:"Установка антивирусов",s2:"Установка программ",s3:"Установка Windows",s4:"Установка игр для ПК",s5:"Установка игр для PS4 и PS5",d1:"Пн – Сб",d2:"Воскресенье",where:"Где нас найти",open:"Сейчас открыто",closed:"Сейчас закрыто"},

en:{and:"and Kirill",city:"Computer help and games in Bukhara",chan:"PS4 and PS5 games channel",call:"Call",map:"Open on map",addr:"26 Mustakillik St, Bukhara",hrs:"Opening hours",svc:"What we do",s1:"Antivirus installation",s2:"Software installation",s3:"Windows installation",s4:"PC game installation",s5:"PS4 and PS5 game installation",d1:"Mon – Sat",d2:"Sunday",where:"How to find us",open:"Open now",closed:"Closed now"}
};
var lang="ru";
try{lang=localStorage.getItem("l")||""}catch(e){}
if(!T[lang]){var n=(navigator.language||"ru").slice(0,2);lang=T[n]?n:"ru"}
function isOpen(){
 var p=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Tashkent",weekday:"short",hour:"numeric",minute:"numeric",hour12:false}).formatToParts(new Date());
 var o={};p.forEach(function(x){o[x.type]=x.value});
 var m=(+o.hour%24)*60+ +o.minute, sun=o.weekday==="Sun";
 return m>=(sun?13*60:10*60+30)&&m<19*60;
}
function render(){
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=T[lang][e.dataset.t]});
 document.querySelectorAll(".top button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===lang)});
 var o=isOpen(),s=document.getElementById("st");
 s.className="status"+(o?" open":"");
 document.getElementById("stt").textContent=o?T[lang].open:T[lang].closed;
}
document.querySelectorAll(".top button").forEach(function(b){b.onclick=function(){lang=b.dataset.l;try{localStorage.setItem("l",lang)}catch(e){}render()}});
render();
</script>
